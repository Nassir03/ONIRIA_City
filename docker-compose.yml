services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oniria-city-backend
    env_file:
      - ./backend/.env.example
    ports:
      - "7000:7000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
